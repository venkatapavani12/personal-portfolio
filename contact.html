<header class="site-header">
    <div class="container">

        <a href="index.html"
           class="logo"
           aria-label="Pavani Portfolio Home">
            Pavani

        <nav aria-label="Primary navigation">

                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>

    </div>
</header>

<main id="main-content">

    <section aria-labelledby="contact-title">
        <div class="container">

            <h1 id="contact-title">Contact Me</h1>

            <p>
                If you would like to get in touch, please use the
                contact form below.
            </p>

            <form
                action="#"
                method="post"
                aria-labelledby="contact-title">

                <div class="form-group">
                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                        aria-required="true">
                </div>

                <div class="form-group">
                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        aria-required="true">
                </div>

                <div class="form-group">
                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                        aria-required="true">
                </div>

                <div class="form-group">
                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                        aria-required="true"></textarea>
                </div>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </div>
    </section>

</main>
